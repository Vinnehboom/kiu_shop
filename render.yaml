services:
  - type: web
    name: kiu-shop
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kiu-shop-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "0"
      - key: SHOP_NAME
        sync: false
      - key: SHOP_MAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: kiu-shop-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []
